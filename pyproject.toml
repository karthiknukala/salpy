[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "salpy"
version = "0.1.0"
description = "Ergonomic Python bindings for the SAL model checker"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "salpy contributors" }]
keywords = ["SAL", "model-checking", "formal-methods"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[tool.setuptools.packages.find]
include = ["salpy*"]

